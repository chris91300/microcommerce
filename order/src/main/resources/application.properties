spring.application.name=order
server.port=8902
inventory.base-url=http://localhost:8901
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=3s
spring.datasource.url=jdbc:h2:mem:order_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=order_user
spring.datasource.password=order_password

# JPA configuration
spring.jpa.hibernate.ddl-auto=update